<svg xmlns="http://www.w3.org/2000/svg" width="360" height="72" viewBox="0 0 360 72" role="img" aria-label="Try the live demo">
  <rect x="0.5" y="0.5" width="359" height="71" rx="36" fill="#ffffff" stroke="#525252" stroke-opacity="0.35"/>
  <circle cx="44" cy="36" r="5" fill="#22c55e"/>
  <circle cx="44" cy="36" r="5" fill="none" stroke="#22c55e" stroke-width="2">
    <animate attributeName="r" values="5;12" dur="1.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="66" y="44" fill="#000000" font-family="Georgia, 'Times New Roman', serif" font-size="23" letter-spacing="0.3">Try the live demo</text>
  <text x="312" y="44" fill="#000000" font-family="Georgia, 'Times New Roman', serif" font-size="23" text-anchor="end">&#8594;</text>
</svg>
