name: irises-bridge
version: 1.0.0
description: >
  Front hermes channels with Irises. Forwards inbound messages from fronted chats to a local
  Irises instance (which answers in its own voice through this hermes's channel connections)
  and suppresses hermes's own reply for those chats. Fronting is opt-in per chat/platform via
  IRISES_FRONT patterns; everything else flows to hermes untouched.
author: Irises
license: MIT
requires_env:
  - IRISES_BRIDGE_TOKEN
optional_env:
  - IRISES_URL             # where Irises runs (default http://127.0.0.1:3000)
  - IRISES_FRONT           # fnmatch patterns over "<platform>:<chat_id>"; empty fronts nothing
  - IRISES_BRIDGE_PORT     # loopback listener for Irises's outbound sends (default 8655)
  - IRISES_BRIDGE_FAIL     # open (default) | closed
  - IRISES_BRIDGE_WORKERS  # forward worker threads / queue shards (default 2, max 16)
  - IRISES_BRIDGE_REVIVE   # on (default) | off: start a stopped local Irises service at gateway start
provides_hooks:
  - pre_gateway_dispatch
